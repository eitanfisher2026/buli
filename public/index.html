  <script>
    // Boot watchdog: if the app hasn't rendered anything into #root within
    // BOOT_TIMEOUT_MS (script failed to load, or loaded but threw before
    // mounting), self-heal ONCE — unregister the service worker, wipe its
    // cache, and reload — before falling back to a plain-HTML retry screen.
    // This exists because there was previously no recovery path at all: a
    // single flaky request could leave someone staring at a blank white
    // screen forever, with "clear your cache" as the only fix — which isn't
    // something we can ask a non-technical user to do on their own.

      var RETRY_FLAG = 'buli_boot_retry';
      var handled = false;

      function cleanupAndReload() {

            .then(function(keys) { return Promise.all(keys.map(function(k) { return caches.delete(k); })); })
            .catch(function() {}));
        }
        Promise.all(jobs).then(function() { location.reload(); }, function() { location.reload(); });
      }

      function showFallback() {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:sans-serif;direction:rtl;">' +

            '<button id="buliRetryBtn" style="background:#2563eb;color:#fff;border:none;padding:14px 28px;border-radius:16px;font-size:15px;font-weight:600;">נסה שוב</button>' +
          '</div>';
        document.getElementById('buliRetryBtn').addEventListener('click', function() {
          try { sessionStorage.removeItem(RETRY_FLAG); } catch(e) {}
          cleanupAndReload();
        });
      }

      window.__buliBootFailed = function() {
        if (handled) return;
        handled = true;
        var already = false;
        try { already = !!sessionStorage.getItem(RETRY_FLAG); } catch(e) {}

        try { sessionStorage.setItem(RETRY_FLAG, '1'); } catch(e) {}
        cleanupAndReload();

        setTimeout(function() {
          var root = document.getElementById('root');
          var booted = root && root.children && root.children.length > 0;
          if (!booted) {
            window.__buliBootFailed();
          } else {
            try { sessionStorage.removeItem(RETRY_FLAG); } catch(e) {}
          }

      });
    })();
